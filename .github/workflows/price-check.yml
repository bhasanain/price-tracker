name: Daily price check

on:
  schedule:
    - cron: "0 6 * * 2,5"   # 06:00 UTC = 09:00 Saudi time, every day
  workflow_dispatch: {}    # lets you press "Run workflow" manually

permissions:
  contents: write          # needed to save prices.csv back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check prices
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python tracker.py
      - name: Save price history
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.csv
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F)"
          git push
